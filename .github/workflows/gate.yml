name: CI gate

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
  pull_request_review:
    types: [submitted, edited]
  issue_comment:
    types: [created, edited]

permissions:
  checks: write
  contents: read
  pull-requests: read

concurrency:
  group: gate-${{ github.event.workflow_run.head_sha || github.event.pull_request.number || github.event.issue.number }}
  cancel-in-progress: false

jobs:
  governance:
    if: github.event_name != 'issue_comment' || github.event.issue.pull_request
    runs-on: ubuntu-24.04
    outputs:
      result: ${{ steps.evaluate.outputs.result }}
    steps:
      - name: Checkout the default branch with checkout v7
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Set up Node with action v7
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.20.0
      - id: evaluate
        run: node scripts/gate.ts governance
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  required:
    needs: governance
    if: always() && needs.governance.result != 'skipped'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout the default branch with checkout v7
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Set up Node with action v7
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.20.0
      - run: node scripts/gate.ts required
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GATE_GOVERNANCE_RESULT: ${{ needs.governance.outputs.result }}
