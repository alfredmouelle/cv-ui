name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  merge_group:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    runs-on: ubuntu-24.04
    outputs:
      previews: ${{ steps.classify.outputs.previews }}
    steps:
      - name: Checkout v7
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Node with action v7
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.20.0
      - name: Classify preview inputs
        id: classify
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ "${{ github.event_name }}" != 'pull_request' ]; then
            echo 'previews=true' >> "$GITHUB_OUTPUT"
          else
            git diff --name-only "$BASE_SHA...$HEAD_SHA" | node scripts/preview-inputs.ts >> "$GITHUB_OUTPUT"
          fi

  verify:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout v7
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Set up CV UI
        uses: ./.github/actions/setup
      - run: pnpm run typecheck
      - run: pnpm run check
      - run: pnpm run test
      - run: pnpm run generate:check

  previews:
    needs: changes
    if: needs.changes.outputs.previews == 'true'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout v7
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Set up CV UI
        uses: ./.github/actions/setup
      - name: Resolve the pinned Playwright builds
        id: playwright
        run: |
          echo "version=$(pnpm exec playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"
          builds=$(pnpm exec playwright install --dry-run chromium firefox webkit \
            | grep -oE '\(playwright [a-z-]+ v[0-9]+\)' | sort -u | sha256sum | cut -c1-16)
          echo "builds=$builds" >> "$GITHUB_OUTPUT"
      - name: Cache Playwright downloads with cache v4
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: ~/.cache/ms-playwright
          key: >-
            ${{ runner.os }}-playwright-${{ hashFiles('pnpm-lock.yaml') }}-${{
            steps.playwright.outputs.version }}-${{ steps.playwright.outputs.builds }}
      - run: sudo apt-get update && sudo apt-get install --yes poppler-utils
      - run: pnpm exec playwright install --with-deps chromium firefox webkit
      - run: pnpm run previews:check
        env:
          CV_UI_PREVIEW_DIAGNOSTICS: ${{ runner.temp }}/cv-ui-preview-diagnostics
      - if: failure()
        name: Upload preview diagnostics with upload-artifact v4
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: preview-failure-${{ github.sha }}
          path: ${{ runner.temp }}/cv-ui-preview-diagnostics
          if-no-files-found: error
          retention-days: 7
